name: RDP_TIPSUNIX - 2.1

on:
  workflow_dispatch:
    inputs:
      timeout_hours:
        description: 'Session timeout (hours, max 6)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
      tz:
        description: 'Timezone for the runner'
        required: true
        default: 'UTC'
        type: choice
        options: ['UTC', 'Asia/Jakarta', 'America/New_York', 'Europe/London', 'Asia/Tokyo']
      enable_chocolatey:
        description: 'Install Chocolatey and basic tools'
        required: false
        default: true
        type: boolean
      download_qoder:
        description: 'Download Qoder installer to Desktop'
        required: false
        default: true
        type: boolean

jobs:
  secure-rdp:
    name: Secure RDP Session
    runs-on: windows-latest
    timeout-minutes: 360  # Maximum allowed by GitHub Actions

    steps:
      - name: 🕐 Set Timezone
        run: |
          $tzMap = @{
              'UTC'              = 'UTC'
              'Asia/Jakarta'     = 'SE Asia Standard Time'
              'America/New_York' = 'Eastern Standard Time'
              'Europe/London'    = 'GMT Standard Time'
              'Asia/Tokyo'       = 'Tokyo Standard Time'
          }
          Set-TimeZone -Id $tzMap["${{ inputs.tz }}"]
          Write-Host "✅ Timezone set to: $((Get-TimeZone).Id)"

      - name: 🔧 Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=domain,private,public
          
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP Firewall configured"

      - name: 👤 Create RDP User
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..47)
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "✅ RDP user created successfully"

      - name: 📦 Install Tools (Essential)
        if: ${{ inputs.enable_chocolatey == true }}
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          choco install -y --no-progress 7zip git notepadplusplus

      - name: ⬇️ Download Qoder Installer
        if: ${{ inputs.download_qoder == true }}
        run: |
          $qoderUrl = "https://download.qoder.com/qoder-app/releases/latest/Qoder-win-x64-user.exe"
          $destPath = "C:\Users\Public\Desktop\Qoder-win-x64-user.exe"

          Write-Host "⬇️ Downloading Qoder installer to Public Desktop..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $qoderUrl -OutFile $destPath -UseBasicParsing

          if (Test-Path $destPath) {
              $sizeMB = [math]::Round((Get-Item $destPath).Length / 1MB, 2)
              Write-Host "✅ Qoder downloaded to Desktop ($sizeMB MB): $destPath"
          } else {
              Write-Warning "⚠️ Failed to download Qoder installer."
          }

      - name: 🌐 Install & Start Tailscale
        run: |
          $stablePage = Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/" -UseBasicParsing
          if ($stablePage.Content -match 'tailscale-setup-[\d\.]+-amd64\.msi') {
              $msiName = $Matches[0]
          } else {
              Write-Error "❌ Could not find latest Tailscale MSI filename on pkgs.tailscale.com"
              exit 1
          }

          $tsUrl = "https://pkgs.tailscale.com/stable/$msiName"
          $installerPath = "$env:TEMP\$msiName"
          Write-Host "⬇️ Downloading latest Tailscale: $msiName"
          
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Write-Host "ℹ️ Installed Tailscale version: $(& $tsExe version | Select-Object -First 1)"

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          $logFile = "$env:TEMP\ts_login.log"

          Start-Process -FilePath $tsExe -ArgumentList "up", "--hostname=$hostname", "--reset" -RedirectStandardError $logFile -NoNewWindow

          Write-Host "⏳ Waiting for Tailscale login URL..."
          $tsIP = $null
          $linkShown = $false
          $retries = 0

          while (-not $tsIP -and $retries -lt 60) {
              if (-not $linkShown -and (Test-Path $logFile)) {
                  $content = Get-Content $logFile -Raw
                  if ($content -match '(https://login\.tailscale\.com/\S+)') {
                      Write-Host "=========================================================="
                      Write-Host "👉 CLICK THIS LINK TO LOGIN TO TAILSCALE:"
                      Write-Host "   $($Matches[1])"
                      Write-Host "=========================================================="
                      $linkShown = $true
                  }
              }

              $tsIP = (& $tsExe ip -4 2>$null | Out-String).Trim()
              if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') { break }
              $tsIP = $null
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "❌ Timed out waiting for Tailscale login/IP assignment."
              if (Test-Path $logFile) { Get-Content $logFile }
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale connected on IP: $tsIP"

      - name: 📋 Display Session Info
        run: |
          Write-Host "=========================================="
          Write-Host " RDP ADDRESS : $env:TAILSCALE_IP"
          Write-Host " USERNAME    : $env:RDP_USER"
          Write-Host " PASSWORD    : $env:RDP_PASS"
          Write-Host "=========================================="

      - name: 🔄 Maintain Session
        run: |
          $timeoutHours = [int]"${{ inputs.timeout_hours }}"
          $endTime = (Get-Date).AddHours($timeoutHours)
          
          while ((Get-Date) -lt $endTime) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session Active... IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }

      - name: 🧹 Cleanup
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" down 2>$null
          Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
